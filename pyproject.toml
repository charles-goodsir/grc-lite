[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grc-lite"
version = "0.0.1"
description = "Compliance-as-code for gap assessments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
grc = "grc_lite.cli:app"

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = ["httpx", "openpyxl>=3.1", "pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/grc_lite"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
