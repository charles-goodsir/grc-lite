- id: E-01
  date: 2026-10-12
  source: HR leavers list and the directory account export
  type: system
  shows: 11 people left in the last quarter. 4 of the 11 still have enabled accounts, and the leaver checklist has no step for removing accounts.
  reliability: Both exports were taken by the assessor. The HR list is complete for the quarter.
- id: E-02
  date: 2026-10-12
  source: Access control policy v2.1 and a permission sample from the code host and the ticket system
  type: document
  shows: The policy ties access to role. In the sample of 12 users across the two systems, 12 of 12 had access matching their role.
  reliability: The policy is the company's own document. The sample was chosen by the assessor.
- id: E-03
  date: 2026-10-13
  source: Access review records
  type: document
  shows: The policy says access is reviewed every 6 months. The last review record is dated 14 months ago and covers 2 of the 5 main systems.
  reliability: The records are the company's own, and the owner confirmed no later review was done.
- id: E-04
  date: 2026-10-13
  source: Administrator list and approval tickets
  type: system
  shows: 6 administrators, each with an approval ticket. 6 of 6 were reviewed in the last 6 months.
  reliability: List exported by the assessor, tickets read on screen.
- id: E-05
  date: 2026-10-14
  source: MFA registration report for administrators and remote users
  type: system
  shows: 5 of 6 administrators have MFA registered. 41 of 58 remote users (71%) have MFA registered.
  reliability: Report generated by the IT lead while the assessor watched.
- id: E-06
  date: 2026-10-14
  source: Backup policy and the latest restore test record
  type: document
  shows: Nightly backups with 30 days kept. A restore test of the main database and file share passed 7 weeks ago.
  reliability: The test record is signed by the person who ran it; the assessor did not watch the test.
- id: E-07
  date: 2026-10-15
  source: Logging settings export and an interview with the IT lead
  type: interview
  shows: Security logs are kept for 14 days and are not reviewed regularly. The IT lead says they are only read after a problem is reported.
  reliability: The settings export is system generated. How often logs are read rests on the interview.
- id: E-08
  date: 2026-10-15
  source: Vulnerability scanner reports for the last quarter
  type: system
  shows: Scans ran every week. The 5 critical findings were fixed in 1 to 6 days.
  reliability: Reports generated by the IT lead, not independently verified.
- id: E-09
  date: 2026-10-16
  source: Statement of Applicability and the last internal audit report
  type: document
  shows: The Statement of Applicability marks 80 of 93 Annex A controls as applicable. The 13 exclusions have no stated reason. The only internal audit in the last year was carried out by the person who runs the management system.
  reliability: Both are the company's own documents, and the author of the audit report is named on it.
