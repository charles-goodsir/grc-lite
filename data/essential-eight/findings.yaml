- id: F-01
  title: Backups have never been test restored
  status: selected
  strength: medium
  strength_reason: The system report is generated by the backup system, but the missing test rests on the IT manager's own notes.
  criteria: [C-10]
  condition: The backup report (E-07) shows nightly backups with 30 days kept, but the recovery notes record no restore test in the 26 months since installation.
  cause: Nobody owns disaster recovery testing, and it is not on the annual plan.
  consequence: The firm may find that backups do not restore only after a ransomware attack or a server failure, when client files are unavailable.
  action: Run a restore test of one server and the file share, record the result, and add a yearly test to the IT plan.
  owner: IT manager
  due: 2026-12-18
  likelihood: 2
  likelihood_reason: Backups run every night, so most failures would be caught, but nothing proves a full restore works.
  impact: 3
  impact_reason: Client files and the accounting data would be unavailable for days if restore fails.
  control_ref: Essential Eight, regular backups
- id: F-02
  title: Laptops used off site are weeks behind on operating system patches
  status: selected
  strength: strong
  strength_reason: The compliance report is exported from the console and the counts match the interview.
  criteria: [C-04]
  condition: 7 of 38 workstations (18%) are between 6 and 11 weeks behind on operating system updates, and all 7 are laptops used off site (E-03).
  cause: Updates install only when a laptop is on the office network, and these laptops rarely are.
  consequence: Known vulnerabilities stay open on devices that leave the building and hold client data.
  action: Make the update service reach laptops over the internet, and report laptops more than 30 days behind each month.
  owner: IT manager
  due: 2026-11-27
  likelihood: 2
  likelihood_reason: The gap has existed for weeks, but exploitation needs a matching attack.
  impact: 2
  impact_reason: A compromised laptop exposes the client files stored on it, but not the servers.
  control_ref: Essential Eight, patch operating systems
- id: F-03
  title: The accounting platform has no multi-factor authentication
  status: selected
  strength: strong
  strength_reason: The setting was shown on screen and matches what the office manager said.
  criteria: [C-05]
  condition: The cloud accounting platform, which holds client fee and bank details, signs in with a password only for all 6 finance users (E-04).
  cause: MFA was switched on for email and files when they were set up, and the accounting platform was added later without the same review.
  consequence: A stolen or guessed password would give access to client bank details and invoicing.
  action: Turn on MFA for the accounting platform for all finance users and review every online service for the same gap.
  owner: Office manager
  due: 2026-11-13
  likelihood: 3
  likelihood_reason: Password-only sign-in is already in use today for all 6 finance users.
  impact: 3
  impact_reason: The platform holds client bank details and can be used to redirect payments.
  control_ref: Essential Eight, multi-factor authentication
- id: F-04
  title: Application control is not applied to workstations
  status: selected
  strength: strong
  strength_reason: The policy export is from the console and shows 0 of 38.
  criteria: [C-01]
  condition: Application control is enabled on 4 of 4 servers and on 0 of 38 workstations (E-01).
  cause: It was applied when the servers were built and was never planned for workstations.
  consequence: Malware that a user downloads can run, and ransomware is the main way this firm would lose its files.
  action: Roll out application control to workstations in a monitoring mode first, then enforce it, starting with the finance team.
  owner: IT manager
  due: 2027-02-26
  likelihood: 2
  likelihood_reason: Users do download and open files, but email filtering stops most malware first.
  impact: 3
  impact_reason: Ransomware on a workstation could reach file shares and client data.
  control_ref: Essential Eight, application control
- id: F-05
  title: Privileged access approvals may not be recorded
  status: candidate
  strength: weak
  strength_reason: No approval records seen yet. Based on the IT manager saying approvals are in email.
- id: F-06
  title: Office macros are not controlled
  status: dropped
  strength: strong
  strength_reason: The policy blocks internet macros for all 38 workstations and the test file confirmed it, so there is no gap.
