- id: E-01
  date: 2026-10-12
  source: Endpoint management console, application control policy export
  type: system
  shows: Application control is enabled on 4 of 4 servers and on 0 of 38 workstations.
  reliability: Exported by the assessor with the IT manager watching.
- id: E-02
  date: 2026-10-13
  source: Vulnerability scanner report, last 8 weeks
  type: system
  shows: Weekly scans ran in all 8 weeks. The 3 critical patches for the web portal were applied 1, 1 and 2 days after release. Browsers and PDF readers were patched within 14 days in the sample of 10 workstations.
  reliability: Report generated by the IT manager, not independently verified.
- id: E-03
  date: 2026-10-13
  source: Patch compliance report, workstations
  type: system
  shows: 31 of 38 workstations (82%) applied the latest monthly operating system update within one month. 7 are between 6 and 11 weeks behind, and all 7 are laptops used off site.
  reliability: Exported by the assessor from the endpoint management console.
- id: E-04
  date: 2026-10-14
  source: Interview with the office manager, and the accounting platform sign-in settings
  type: interview
  shows: Email and the file store require MFA. The cloud accounting platform, which holds client fee and bank details, signs in with a password only for all 6 finance users.
  reliability: The interview is the office manager's word. The platform setting was shown on screen.
- id: E-05
  date: 2026-10-14
  source: Directory export of privileged accounts and the web filtering policy
  type: system
  shows: 3 people have a separate admin account. The 3 admin accounts are in a group that is blocked from the web and has no mailbox.
  reliability: Exported by the assessor; the filtering policy was read on screen.
- id: E-06
  date: 2026-10-15
  source: Office macro policy export and a test file
  type: system
  shows: Macros are blocked in files from the internet for all 38 workstations. The test file opened with macros disabled. Users cannot change the setting.
  reliability: Policy exported by the assessor, and the test was run in front of the assessor.
- id: E-07
  date: 2026-10-15
  source: Backup system report and the IT manager's disaster recovery notes
  type: document
  shows: Nightly backups cover all servers with 30 days kept. The notes record no restore test since the system was installed 26 months ago.
  reliability: The report is system generated. The absence of a test rests on the IT manager's notes, so ask whether anything is unrecorded.
- id: E-08
  date: 2026-10-15
  source: Backup system permissions screen
  type: system
  shows: Only the 3 admin accounts can modify or delete backups. Ordinary users have no access.
  reliability: Screen shown by the IT manager, not exported.
